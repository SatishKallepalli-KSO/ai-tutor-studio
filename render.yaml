# Free-tier live stack on Render (web) + Neon Free (Postgres)
# App: https://practiceoutloud.com (fallback: https://ai-tutor-studio.onrender.com)
# Repo: https://github.com/SatishKallepalli-KSO/practice-out-loud
#
# DATABASE_URL must be set in the Render dashboard to your Neon pooled
# connection string (do not commit secrets). Neon project: steep-sunset-42393062

services:
  - type: web
    name: ai-tutor-studio
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://practiceoutloud.com
      - key: ALLOW_DEMO_UPGRADE
        value: "true"
      - key: OPENAI_TUTOR_MODEL
        value: gpt-4o-mini
      # Set in dashboard: Neon pooled URL (postgresql://...@...-pooler.../aitutor?sslmode=require)
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
