# Free-tier live stack on Render (Blueprint)
# One-click: https://render.com/deploy?repo=https://github.com/SatishKallepalli-KSO/ai-tutor-studio
#
# Free URL after deploy: https://ai-tutor-studio.onrender.com
# (cold-starts on free plan after idle — normal for free hosting)

databases:
  - name: ai-tutor-studio-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-tutor-studio
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://ai-tutor-studio.onrender.com
      # Free launch without Stripe — Pro via Demo upgrade; set false when Stripe is live
      - key: ALLOW_DEMO_UPGRADE
        value: "true"
      - key: OPENAI_TUTOR_MODEL
        value: gpt-4o-mini
      - key: DATABASE_URL
        fromDatabase:
          name: ai-tutor-studio-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_YEARLY
        sync: false
